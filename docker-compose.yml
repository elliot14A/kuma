name: kuma

services:
  postgres:
    image: postgres:16-alpine
    container_name: kuma-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=kuma
      - POSTGRES_PASSWORD=kuma_dev_password
      - POSTGRES_DB=kuma
    volumes:
      - kuma_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kuma -d kuma"]
      interval: 3s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: kuma:latest
    container_name: kuma-migrate
    environment:
      - KUMA_DATABASE_URL=postgres://kuma:kuma_dev_password@postgres:5432/kuma
    depends_on:
      postgres:
        condition: service_healthy
    command: ["migrate"]
    restart: "no"

  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: kuma:latest
    container_name: kuma-server
    ports:
      - "${KUMA_PORT:-8080}:8080"
    environment:
      - KUMA_SERVER_HOST=0.0.0.0
      - KUMA_SERVER_PORT=8080
      - KUMA_DATABASE_URL=postgres://kuma:kuma_dev_password@postgres:5432/kuma
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["server"]

volumes:
  kuma_pgdata:
