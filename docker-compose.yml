name: kuma

services:
  postgres:
    image: postgres:17-alpine
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=kuma
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: kuma:latest
    ports:
      - "${KUMA_SERVER_PORT:-8080}:8080"
    environment:
      - KUMA_SERVER_HOST=0.0.0.0
      - KUMA_SERVER_PORT=8080
      - KUMA_DATABASE_URL=postgres://postgres:postgres@postgres:5432/kuma
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["server"]
    develop:
      watch:
        - action: rebuild
          path: package.json
        - action: rebuild
          path: bun.lock
        - action: sync+restart
          path: ./apps
          target: /app/apps
        - action: sync+restart
          path: ./packages
          target: /app/packages
        - action: sync+restart
          path: ./migrations
          target: /app/migrations

  migrate:
    image: kuma:latest
    environment:
      - KUMA_DATABASE_URL=postgres://postgres:postgres@postgres:5432/kuma
    depends_on:
      postgres:
        condition: service_healthy
    command: ["migrate"]
    restart: "no"

volumes:
  postgres_data:
